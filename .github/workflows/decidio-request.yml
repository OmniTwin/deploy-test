name: Ask Decidio to deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/decidio-request.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: OmniTwin/decidio-actions@abae9c444b3ee2bb29606bbc239432c7874c405a # v1.2.0
        with:
          step: request
          environment: production
          api-url: https://mcp.decidioai.com
