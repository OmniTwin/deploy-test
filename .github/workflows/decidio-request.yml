name: Ask Decidio to deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/decidio-request.yml
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  ask_production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: OmniTwin/decidio-actions@069bfe2c63ded6abe503fc998ee0cac3b7f82269 # v1.4.0
        with:
          step: request
          environment: production
          api-url: https://mcp-staging.decidioai.com
  ask_staging:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: OmniTwin/decidio-actions@069bfe2c63ded6abe503fc998ee0cac3b7f82269 # v1.4.0
        with:
          step: request
          environment: staging
          api-url: https://mcp-staging.decidioai.com
  check:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: OmniTwin/decidio-actions@069bfe2c63ded6abe503fc998ee0cac3b7f82269 # v1.4.0
        with:
          step: request
          environment: production
          api-url: https://mcp-staging.decidioai.com
