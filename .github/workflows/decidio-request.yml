name: Ask Decidio to deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/decidio-request.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: OmniTwin/decidio-actions@1fee85aead22b3d47f545153a8b1b42efccf2e35 # v1.1.0
        with:
          step: request
          environment: production
          api-url: https://mcp.decidioai.com
