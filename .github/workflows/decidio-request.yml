name: Ask Decidio to deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/decidio-request.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: OmniTwin/decidio-actions@c4506075600edef9576db821c4de756c300c15fe # v1.0.1
        with:
          step: request
          environment: production
          api-url: https://mcp.decidioai.com
