name: Deploy
run-name: ${{ inputs.title || format('Decidio {0}', inputs.decidio) }}
on:
  workflow_dispatch:
    inputs:
      decidio:
        description: Set by Decidio
        required: true
      title:
        description: Set by Decidio (the run's name - its record, environment and commit)
        required: false
      environment:
        description: Set by Decidio (production, staging)
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - id: decidio
        uses: OmniTwin/decidio-actions@f0b43fcb8f8ac5e15d9ad43679e333ffa7038ae2 # v1.3.1
        with:
          step: verify
          decision: ${{ inputs.decidio }}
          api-url: https://mcp.decidioai.com
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.decidio.outputs.sha }}
      - name: Deploy
        run: echo "Deploying ${{ steps.decidio.outputs.sha }} - replace this line with your deploy command"
