name: Deploy
run-name: ${{ inputs.title || format('Decidio {0}', inputs.decidio) }}
on:
  workflow_dispatch:
    inputs:
      decidio:
        description: "For the test, type emergency: and why"
        required: true
      title:
        description: Set by Decidio
        required: false
      simulate_outage:
        description: "T-E5 only - make staging unreachable from this run"
        type: boolean
        default: true
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "T-E5 - make staging unreachable"
        if: ${{ inputs.simulate_outage }}
        run: echo "0.0.0.0 mcp-staging.decidioai.com" | sudo tee -a /etc/hosts
      - id: decidio
        uses: OmniTwin/decidio-actions@t-e5-staging-test
        with:
          step: verify
          decision: ${{ inputs.decidio }}
          api-url: https://mcp-staging.decidioai.com
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.decidio.outputs.sha }}
      - name: Deploy
        run: echo "T-E5 - the deploy would run here"
